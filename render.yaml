services:
  - type: web
    name: tillpoint-order-desk
    runtime: python
    buildCommand: pip install -r requirements.txt && python -m pytest -v
    startCommand: gunicorn web_app:wsgi_app --bind 0.0.0.0:$PORT --workers 1 --threads 4
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.17
